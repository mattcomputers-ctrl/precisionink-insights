# Precision Ink Insights — log rotation
# Installed to /etc/logrotate.d/precision-ink-insights by install-ubuntu.sh.
# update.sh re-copies this file on every pull so policy changes propagate.

# NOTE: logrotate does NOT accept trailing `# comment` on the same line
# as a directive — keep all comments on their own lines.

/var/www/precision-ink-insights/storage/logs/*.log {
    # Rotate every day
    daily

    # Keep 14 days of history
    rotate 14

    # gzip rotated logs, but skip yesterday's (in case the cron is still
    # appending to it when rotation runs)
    compress
    delaycompress

    # Don't error if a log file doesn't exist (fresh install before first run)
    missingok

    # Skip rotation when the file is empty
    notifempty

    # Restore ownership + perms for the newly-rotated active file
    create 0664 www-data www-data

    sharedscripts
}
