# Precision Ink Insights — log rotation
# Installed to /etc/logrotate.d/precision-ink-insights by install-ubuntu.sh.
# update.sh re-copies this file on every pull so policy changes propagate.

/var/www/precision-ink-insights/storage/logs/*.log {
    daily              # rotate every day
    rotate 14          # keep 14 days of history
    compress           # gzip rotated logs
    delaycompress      # don't compress yesterday's yet (in case it's still being appended)
    missingok          # don't error if a log doesn't exist (e.g. before first run)
    notifempty         # skip rotation when file is empty
    create 0664 www-data www-data
    sharedscripts
}
